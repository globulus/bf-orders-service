name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # Tests tagged known-bug are listed in docs/KNOWN_ISSUES.md and skipped here only.
      - name: Build and test
        run: ./gradlew build -PexcludeTags=known-bug

      - name: Generate OpenAPI spec
        run: ./gradlew generateOpenApi

      - name: Upload OpenAPI spec
        uses: actions/upload-artifact@v4
        with:
          name: orders-openapi
          path: build/openapi/orders.json
          if-no-files-found: error

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests/
